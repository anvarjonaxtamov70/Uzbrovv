name: Keep Alive (eski Render serveri — ENDI KERAK EMAS)

# =====================================================================
#  2.0.0: BOT CLOUDFLARE WORKER'DA — bu workflow avtomatik ISHLAMAYDI.
#
#  Ilgari Render bepul tarifida bot uxlamasligi uchun har 10 daqiqada
#  ping yuborilardi. Endi bot webhook orqali Cloudflare Worker'da ishlaydi:
#  Worker uxlamaydi va ping kerak emas. Jadval (cron) olib tashlandi —
#  Render to'xtatilgan bo'lsa har 10 daqiqada «yiqildi» xati kelmasin.
#
#  Python serverni (Render/Oracle) qayta ishlatsangiz — qo'lda ishga
#  tushirishingiz mumkin: Actions -> Keep Alive -> Run workflow.
#
#  MANZIL: repo -> Settings -> Secrets and variables -> Actions ->
#  Variables -> KEEP_ALIVE_URLS
# =====================================================================
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Faqat shu manzilni ping qilish (bo'sh qoldirsangiz — standart)"
        required: false
        default: ''

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Botga ping yuborish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping
        env:
          URLS_VAR: ${{ vars.KEEP_ALIVE_URLS }}
          URL_INPUT: ${{ github.event.inputs.url }}
        run: |
          set -u

          # render.yaml dagi xizmat nomi asosidagi standart manzil
          DEFAULT_URLS="https://zimmer-bot.onrender.com"

          if [ -n "${URL_INPUT// /}" ]; then
            URLS="$URL_INPUT"
            echo "Qo'lda kiritilgan manzil ishlatilyapti."
          elif [ -n "${URLS_VAR// /}" ]; then
            URLS="$URLS_VAR"
            echo "KEEP_ALIVE_URLS repo variable'i ishlatilyapti."
          else
            URLS="$DEFAULT_URLS"
            echo "Standart manzil ishlatilyapti."
          fi

          ok=0
          fail=0
          suspended=0
          missing=0

          for raw in $URLS; do
            base="${raw%/}"
            [ -z "$base" ] && continue
            url="$base/health"

            code=""
            # Uxlagan xizmat "sovuq start" uchun 60 soniyagacha vaqt oladi
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -L \
                       -w '%{http_code}' \
                       --max-time 120 \
                       -H 'User-Agent: github-actions-keep-alive' \
                       "$url" 2>/dev/null || echo "000")
              case "$code" in
                2*|3*) break ;;
              esac
              echo "  urinish $attempt: $code — 15s dan keyin qayta..."
              sleep 15
            done

            case "$code" in
              2*|3*)
                echo "✅ $url -> $code (uyg'oq)"
                ok=$((ok + 1))
                ;;
              404)
                echo "::warning title=Xizmat topilmadi::$url -> 404. Render'da bu nomdagi xizmat mavjud emas. Manzilni tekshiring."
                missing=$((missing + 1))
                ;;
              503)
                # 3 marta urinishdan keyin ham 503 — bu UYQU EMAS.
                echo "::error title=Xizmat to'xtatilgan (503)::$url -> 503. Bu sovuq start EMAS (3 marta urinildi). Tekshiring: (1) Render -> Billing -> free instance hours tugaganmi? (2) Render -> xizmat -> Events: oxirgi deploy yiqilganmi? (3) Logs: bot ishga tushayotganda xato beryaptimi?"
                suspended=$((suspended + 1))
                ;;
              *)
                echo "::warning title=Ping muvaffaqiyatsiz::$url -> $code"
                fail=$((fail + 1))
                ;;
            esac
          done

          echo ""
          echo "Natija: $ok uyg'oq | $suspended to'xtatilgan(503) | $missing topilmadi(404) | $fail boshqa xato"

          if [ "$ok" -eq 0 ] && [ $((suspended + fail)) -gt 0 ]; then
            echo "::error title=Bot javob bermadi::Yuqoridagi izohlarni o'qing."
            exit 1
          fi
